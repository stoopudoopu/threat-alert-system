[project]
name = "threatalert"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GlubbTubbasWepple", email = "glubbtubbaswepple@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langgraph>=1.2.19",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
threatalert = "threatalert.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
